{% extends "base.html" %}

{% block title %}{{ title }} — {{ site.title }}{% endblock %}

{% block content %}
<article>
    <header>
    <div class="page-header">
        <div>
            <h1>{{ title }}</h1>
            <time>{{ date }}</time>
        </div>
        <a href="/posts" class="back-btn">← back</a>
    </div>
</header>
    <hr class="content-divider">
    <div class="content">
        {{ content | safe }}
    </div>
</article>
{% endblock %}
